<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>私房菜谱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f5f0e8;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:440px;background:#fffdf7;min-height:100vh;position:relative;padding-bottom:80px}

/* header */
.hd{background:linear-gradient(135deg,#7a1518,#b5312c);padding:42px 20px 22px;text-align:center;position:sticky;top:0;z-index:100}
.hd h1{color:#fff;font-size:22px;font-weight:700;letter-spacing:6px}
.hd .sub{color:rgba(255,255,255,.7);font-size:11px;letter-spacing:2px;margin-top:6px}

/* tabs */
.tabs{display:flex;gap:0;position:sticky;top:82px;z-index:99;background:#fffdf7;border-bottom:1px solid #f0ebe3}
.tab{flex:1;text-align:center;padding:12px 0;font-size:13px;color:#a09080;cursor:pointer;position:relative;transition:.2s;letter-spacing:1px}
.tab.on{color:#7a1518;font-weight:600}
.tab.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:#7a1518;border-radius:2px}

/* body */
.bd{padding:14px}

/* card */
.card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);transition:transform .2s}
.card:active{transform:scale(.98)}
.card.hide{display:none}
.card-img-wrap{position:relative;width:100%;height:200px;overflow:hidden;cursor:pointer}
.card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card-img-wrap:hover .card-img{transform:scale(1.04)}
.card-cat{position:absolute;top:12px;left:12px;background:rgba(122,21,24,.85);color:#fff;font-size:10px;padding:3px 10px;border-radius:20px;letter-spacing:1px}

.card-body{padding:14px 16px 16px}
.card-row{display:flex;justify-content:space-between;align-items:center}
.card-name{font-size:17px;font-weight:700;color:#2c1810;letter-spacing:1px}
.card-ctrl{display:flex;align-items:center;gap:10px}
.btn-minus,.btn-plus{width:30px;height:30px;border-radius:50%;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.btn-minus{background:#f5f0e8;color:#7a1518}
.btn-minus:active{background:#e8ddd0}
.btn-plus{background:#7a1518;color:#fff}
.btn-plus:active{background:#5a0f12}
.card-qty{font-size:15px;font-weight:700;color:#2c1810;min-width:16px;text-align:center}
.card-qty.zero{color:#ccc}

.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#fef0e7;color:#b5312c;font-size:10px;padding:2px 8px;border-radius:12px}

.card-desc{font-size:12px;color:#9a8b7d;line-height:1.7;margin-top:8px;display:none}
.card.open .card-desc{display:block}
.card-toggle{font-size:11px;color:#b5312c;margin-top:6px;cursor:pointer;letter-spacing:1px}

/* cart bar */
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid #eee;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;z-index:200;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.cart-left{display:flex;align-items:center;gap:10px}
.cart-icon{position:relative;width:44px;height:44px;background:#7a1518;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.cart-badge{position:absolute;top:-4px;right:-4px;background:#ff4444;color:#fff;font-size:10px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.cart-badge.hide{display:none}
.cart-info .ct{font-size:14px;font-weight:600;color:#2c1810}
.cart-info .cl{font-size:11px;color:#a09080;margin-top:2px}
.cart-btn{background:#7a1518;color:#fff;border:none;padding:10px 24px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:2px;transition:.15s}
.cart-btn:active{background:#5a0f12}
.cart-btn:disabled{background:#ccc;cursor:default}

/* cart drawer */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;display:none}
.overlay.show{display:block}
.drawer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fffdf7;border-radius:20px 20px 0 0;z-index:301;max-height:60vh;overflow-y:auto;transition:transform .3s;padding:20px 18px 24px}
.drawer.hide{transform:translateY(100%)}
.drawer-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer-hd h3{font-size:16px;color:#2c1810;letter-spacing:2px}
.drawer-clear{font-size:12px;color:#b5312c;cursor:pointer;letter-spacing:1px}
.drawer-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f0e8}
.drawer-item-name{font-size:14px;color:#2c1810;font-weight:500}
.drawer-item-ctrl{display:flex;align-items:center;gap:8px}
.drawer-item-ctrl .btn-minus,.drawer-item-ctrl .btn-plus{width:26px;height:26px;font-size:15px}
.empty-msg{text-align:center;color:#bbb;font-size:13px;padding:30px 0}

/* toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:10px 28px;border-radius:24px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:2px}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <h1>私房菜谱</h1>
    <p class="sub">爱心手作 · 家的味道</p>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-cat="all">全部</div>
    <div class="tab" data-cat="homestyle">家常热菜</div>
    <div class="tab" data-cat="main">硬菜大菜</div>
  </div>

  <div class="bd" id="menu"></div>

  <div class="cart-bar">
    <div class="cart-left">
      <div class="cart-icon" id="cartIcon" onclick="toggleDrawer()">
        🍽
        <span class="cart-badge hide" id="badge">0</span>
      </div>
      <div class="cart-info">
        <div class="ct" id="cartTotal">未选菜品</div>
        <div class="cl" id="cartHint">点击菜品旁 + 加入</div>
      </div>
    </div>
    <button class="cart-btn" id="cartBtn" disabled onclick="submitOrder()">确认选菜</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="drawer hide" id="drawer">
  <div class="drawer-hd">
    <h3>🧾 已选菜品</h3>
    <span class="drawer-clear" onclick="clearAll()">清空</span>
  </div>
  <div id="drawerList"></div>
</div>

<div class="toast" id="toast"></div>

var currentCat="all";

function render(){
  var html="";
  dishes.forEach(function(d){
    var show=currentCat==="all"||d.cat===currentCat;
    html+='<div class="card'+(show?'':' hide')+'" id="card-'+d.id+'">';
    html+='<div class="card-img-wrap" onclick="toggleDesc('+d.id+')">';
    html+='<img class="card-img" src="'+d.img+'" alt="'+d.name+'">';
    html+='<span class="card-cat">'+d.catName+'</span></div>';
    html+='<div class="card-body"><div class="card-row">';
    html+='<span class="card-name">'+d.name+'</span>';
    html+='<div class="card-ctrl">';
    if(d.qty>0){
      html+='<button class="btn-minus" onclick="changeQty('+d.id+',-1)">－</button>';
      html+='<span class="card-qty">'+d.qty+'</span>';
    }
    html+='<button class="btn-plus" onclick="changeQty('+d.id+',1)">＋</button>';
    html+='</div></div>';
    html+='<div class="tags">'+d.tags.map(function(t){return'<span class="tag">'+t+'</span>'}).join('')+'</div>';
    html+='<p class="card-desc">'+d.desc+'</p>';
    html+='<div class="card-toggle" onclick="toggleDesc('+d.id+')">▾ 点击查看详情</div>';
    html+='</div></div>';
  });
  document.getElementById("menu").innerHTML=html;
  updateCart();
}

function toggleDesc(id){
  var el=document.getElementById("card-"+id);
  el.classList.toggle("open");
  var tog=el.querySelector(".card-toggle");
  if(el.classList.contains("open")){
    tog.textContent="▴ 收起详情";
  }else{
    tog.textContent="▾ 点击查看详情";
  }
}

function changeQty(id,delta){
  var d=dishes.find(function(x){return x.id===id});
  d.qty=Math.max(0,d.qty+delta);
  if(delta>0&&d.qty===1)showToast("已添加「"+d.name+"」");
  if(d.qty===0)showToast("已移除「"+d.name+"」");
  render();
}

function updateCart(){
  var total=0;
  var count=0;
  dishes.forEach(function(d){total+=d.qty;if(d.qty>0)count++});
  var badge=document.getElementById("badge");
  var cartTotal=document.getElementById("cartTotal");
  var cartHint=document.getElementById("cartHint");
  var cartBtn=document.getElementById("cartBtn");
  if(total>0){
    badge.textContent=total;badge.classList.remove("hide");
    cartTotal.textContent="已选 "+count+" 道菜，共 "+total+" 份";
    cartHint.textContent="点击购物车查看详情";
    cartBtn.disabled=false;
  }else{
    badge.classList.add("hide");
    cartTotal.textContent="未选菜品";
    cartHint.textContent="点击菜品旁 ＋ 加入";
    cartBtn.disabled=true;
  }
  renderDrawer();
}

function renderDrawer(){
  var list=document.getElementById("drawerList");
  var selected=dishes.filter(function(d){return d.qty>0});
  if(selected.length===0){
    list.innerHTML='<div class="empty-msg">还没有选菜哦～</div>';
    return;
  }
  var html="";
  selected.forEach(function(d){
    html+='<div class="drawer-item"><span class="drawer-item-name">'+d.name+'</span>';
    html+='<div class="drawer-item-ctrl">';
    html+='<button class="btn-minus" onclick="changeQty('+d.id+',-1)">－</button>';
    html+='<span class="card-qty">'+d.qty+'</span>';
    html+='<button class="btn-plus" onclick="changeQty('+d.id+',1)">＋</button>';
    html+='</div></div>';
  });
  list.innerHTML=html;
}

function toggleDrawer(){
  var o=document.getElementById("overlay");
  var d=document.getElementById("drawer");
  var showing=o.classList.contains("show");
  if(showing){o.classList.remove("show");d.classList.add("hide")}
  else{o.classList.add("show");d.classList.remove("hide")}
}

function clearAll(){
  dishes.forEach(function(d){d.qty=0});
  showToast("已清空");
  render();
  toggleDrawer();
}

function submitOrder(){
  var lines=[];
  dishes.filter(function(d){return d.qty>0}).forEach(function(d){
    lines.push(d.name+" ×"+d.qty);
  });
  showToast("已选："+lines.join("、"));
}

function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(function(){t.classList.remove("show")},1800);
}

// tabs
document.getElementById("tabs").addEventListener("click",function(e){
  if(!e.target.classList.contains("tab"))return;
  currentCat=e.target.dataset.cat;
  var tabs=document.querySelectorAll(".tab");
  tabs.forEach(function(t){t.classList.remove("on")});
  e.target.classList.add("on");
  render();
});

render();
</script>
