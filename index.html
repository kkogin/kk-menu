<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>私房菜谱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f5f0e8;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:440px;background:#fffdf7;min-height:100vh;position:relative;padding-bottom:80px}
.hd{background:linear-gradient(135deg,#7a1518,#b5312c);padding:42px 20px 22px;text-align:center;position:relative;z-index:1}
.hd h1{color:#fff;font-size:22px;font-weight:700;letter-spacing:6px}
.hd .sub{color:rgba(255,255,255,.7);font-size:11px;letter-spacing:2px;margin-top:6px}
.tabs{display:flex;gap:0;position:sticky;top:0;z-index:500;background:#fffdf7;border-bottom:1px solid #f0ebe3;overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:0 3px 10px rgba(44,24,16,.09)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-align:center;padding:12px 14px;font-size:13px;color:#a09080;cursor:pointer;position:relative;transition:.2s;letter-spacing:1px;white-space:nowrap}
.tab.on{color:#7a1518;font-weight:600}
.tab.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:#7a1518;border-radius:2px}
.bd{padding:14px}
.card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);transition:transform .2s}
.card:active{transform:scale(.98)}
.card.hide{display:none}
.card-img-wrap{position:relative;width:100%;height:200px;overflow:hidden;cursor:pointer}
.card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card-img-wrap:active .card-img{transform:scale(1.03)}
.card-cat{position:absolute;top:10px;left:10px;background:rgba(122,21,24,.85);color:#fff;font-size:10px;padding:3px 10px;border-radius:20px;letter-spacing:1px}
.card-body{padding:12px 16px 16px}
.card-row{display:flex;justify-content:space-between;align-items:center}
.card-name{font-size:17px;font-weight:700;color:#2c1810;letter-spacing:1px}
.card-ctrl{display:flex;align-items:center;gap:10px}
.btn-m,.btn-p{width:30px;height:30px;border-radius:50%;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1}
.btn-m{background:#f5f0e8;color:#7a1518}
.btn-m:active{background:#e8ddd0}
.btn-p{background:#7a1518;color:#fff}
.btn-p:active{background:#5a0f12}
.card-qty{font-size:15px;font-weight:700;color:#2c1810;min-width:16px;text-align:center}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#fef0e7;color:#b5312c;font-size:10px;padding:2px 8px;border-radius:12px}
.card-desc{font-size:12px;color:#9a8b7d;line-height:1.7;margin-top:8px;max-height:0;overflow:hidden;transition:max-height .3s}
.card.open .card-desc{max-height:200px}
.card-toggle{font-size:11px;color:#b5312c;margin-top:6px;cursor:pointer;letter-spacing:1px;text-align:center}
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid #eee;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:200;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.cart-left{display:flex;align-items:center;gap:10px}
.cart-icon{position:relative;width:42px;height:42px;background:#7a1518;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.cart-badge{position:absolute;top:-4px;right:-4px;background:#ff4444;color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
.cart-badge.hide{display:none}
.cart-info .ct{font-size:14px;font-weight:600;color:#2c1810}
.cart-info .cl{font-size:11px;color:#a09080;margin-top:1px}
.cart-btn{background:#7a1518;color:#fff;border:none;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:2px;transition:.15s}
.cart-btn:active{background:#5a0f12}
.cart-btn:disabled{background:#ccc;cursor:default}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;display:none}
.overlay.show{display:block}
.drawer{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:440px;background:#fffdf7;border-radius:20px 20px 0 0;z-index:301;max-height:55vh;overflow-y:auto;transition:transform .3s;padding:18px 16px 24px}
.drawer.show{transform:translateX(-50%) translateY(0)}
.drawer-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.drawer-hd h3{font-size:15px;color:#2c1810;letter-spacing:2px}
.drawer-clear{font-size:12px;color:#b5312c;cursor:pointer;letter-spacing:1px}
.drawer-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f0e8}
.drawer-item-name{font-size:14px;color:#2c1810;font-weight:500}
.drawer-item-ctrl{display:flex;align-items:center;gap:8px}
.drawer-item-ctrl .btn-m,.drawer-item-ctrl .btn-p{width:26px;height:26px;font-size:15px}
.empty-msg{text-align:center;color:#bbb;font-size:13px;padding:30px 0}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:#fff;padding:10px 26px;border-radius:24px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:1px}
.toast.show{opacity:1}
.counter{font-size:11px;color:#bfb0a0;text-align:center;margin-bottom:12px;letter-spacing:1px}
</style>
</head>
<body>
<div class="app">
  <div class="hd"><h1>私房菜谱</h1><p class="sub">爱心手作 · 家的味道</p></div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-cat="all">全部</div>
    <div class="tab" data-cat="homestyle">家常小炒</div>

    <div class="tab" data-cat="soup">汤粥主食</div>
    <div class="tab" data-cat="dessert">甜品酱料</div>

  <div class="cart-bar">

    </div>
    <button class="cart-btn" id="cartBtn" disabled onclick="submitOrder()">确认选菜</button>
  </div>
</div>
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-hd"><h3>🧾 已选菜品</h3><span class="drawer-clear" onclick="clearAll()">清空</span></div>
  <div id="drawerList"></div>
</div>
<div class="toast" id="toast"></div>
<script>
var dishes=[{"name":"酸辣土豆丝","cat":"homestyle","catName":"家常小炒","tags":["🌶 微辣","🥔 家常","⚡ 爽脆"],"desc":"土豆切成细丝大火爆炒，干辣椒蒜瓣爆香，撒上葱花，酸辣开胃下饭神菜。","image":"assets/original-01.jpg"},{"name":"鱼香茄子","cat":"homestyle","catName":"家常小炒","tags":["🍆 茄子","🌶 微辣","👍 经典"],"desc":"茄子与青椒翻炒，鱼香酱汁浓郁入味，软糯鲜香，配米饭一绝。","image":"assets/original-02.jpg"},{"name":"芹菜肉渣","cat":"homestyle","catName":"家常小炒","tags":["🥬 清爽","🥩 肉香"],"desc":"新鲜芹菜搭配肉渣快炒，清脆爽口，简单却不平凡的家常味道。","image":"assets/original-03.jpg"},{"name":"排骨土豆炖豆角","cat":"main","catName":"硬菜大菜","tags":["🦴 排骨","🥔 土豆","🫘 豆角"],"desc":"排骨与土豆、豆角一锅炖，汤汁浓郁酱香，肉烂豆角入味，家常硬菜。","image":"assets/original-04.jpg"},{"name":"清炒西葫芦丝","cat":"homestyle","catName":"家常小炒","tags":["🥒 清淡","🌿 素菜"],"desc":"西葫芦切丝快炒，花椒干辣椒点缀，清淡爽口，解腻好搭档。","image":"assets/original-05.jpg"},{"name":"蒜蓉芦笋","cat":"homestyle","catName":"家常小炒","tags":["🌿 健康","🧄 蒜香"],"desc":"新鲜芦笋焯水后蒜蓉调味，翠绿鲜嫩，营养又好看。","image":"assets/original-06.jpg"},{"name":"炒合菜","cat":"homestyle","catName":"家常小炒","tags":["🥬 什锦","🍳 鸡蛋","🫘 粉条"],"desc":"粉条、豆芽、鸡蛋、韭菜等多种食材合炒，丰富多彩有滋有味。","image":"assets/original-07.jpg"},{"name":"毛血旺","cat":"main","catName":"硬菜大菜","tags":["🦐 有虾","🌶🌶 中辣","🏆 压轴"],"desc":"大虾、鸭血、腐竹、毛肚浸在红油麻辣汤底里，花椒麻辣椒香芝麻点缀，全场焦点。","image":"assets/original-08.jpg"},{"name":"干锅鹿茸菇","cat":"main","catName":"硬菜大菜","tags":["🍄 鲜香","🔥 干锅","✨ 拿手菜"],"desc":"鹿茸菇配多种菌菇铜锅煸炒收汁，干辣椒蒜片提香，越嚼越香锅气满满。","image":"assets/original-09.jpg"},{"name":"姜母鸭","cat":"main","catName":"硬菜大菜","tags":["🦆 鸭肉","🫚 姜香","🍲 砂锅"],"desc":"整鸭与老姜一同砂锅慢焖，姜香浓郁鸭肉酥烂，滋补暖身的经典闽菜。","image":"assets/original-10.jpg"},{"name":"红烧猪蹄","cat":"main","catName":"硬菜大菜","tags":["🐷 猪蹄","🍯 软糯","💪 胶原蛋白"],"desc":"猪蹄红烧至酱色油亮，软糯脱骨入口即化，满满胶原蛋白。","image":"assets/original-11.jpg"},{"name":"蒜蓉蒸帝王蟹","cat":"main","catName":"硬菜大菜","tags":["🦀 帝王蟹","🧄 蒜蓉","👑 宴席菜"],"desc":"帝王蟹开背铺蒜蓉清蒸，蟹肉鲜甜饱满，蒜香与蟹香完美融合，宴席级别硬菜。","image":"assets/original-12.jpg"},{"name":"蟹黄蒸蛋","cat":"main","catName":"硬菜大菜","tags":["🦀 蟹黄","🥚 蒸蛋","🌟 鲜美"],"desc":"嫩滑蒸蛋与整只螃蟹同蒸，蟹黄渗透蛋液，鲜美无比。","image":"assets/original-13.jpg"},{"name":"沙拉酱焗虾仁","cat":"main","catNam dishes.forEach(function(d,i){d.id=i;d.qty=0});
var currentCat="all";
function render(){
  var shown=dishes.filter(function(d){return currentCat==="all"||d.cat===currentCat});
  var html='<p class="counter">共 '+shown.length+' 道菜品</p>';
  dishes.forEach(function(d){
    var show=currentCat==="all"||d.cat===currentCat;
    html+='<div class="card'+(show?'':' hide')+'" id="c'+d.id+'">';
    html+='<div class="card-img-wrap" onclick="tog('+d.id+')">';
    html+='<img class="card-img" src="'+d.image+'" alt="'+d.name+'">';
    html+='<span class="card-cat">'+d.catName+'</span></div>';
    html+='<div class="card-body"><div class="card-row">';
    html+='<span class="card-name">'+d.name+'</span>';
    html+='<div class="card-ctrl">';
    if(d.qty>0)html+='<button class="btn-m" onclick="chg('+d.id+',-1)">－</button><span class="card-qty">'+d.qty+'</span>';
    html+='<button class="btn-p" onclick="chg('+d.id+',1)">＋</button></div></div>';
    html+='<div class="tags">'+d.tags.map(function(t){return'<span class="tag">'+t+'</span>'}).join('')+'</div>';
    html+='<p class="card-desc">'+d.desc+'</p>';
    html+='<div class="card-toggle" onclick="tog('+d.id+')">▾ 点击查看详情</div>';
    html+='</div></div>';
  });
  document.getElementById("menu").innerHTML=html;
  updCart();
}
function tog(id){
  var el=document.getElementById("c"+id);
  el.classList.toggle("open");
  var t=el.querySelector(".card-toggle");
  t.textContent=el.classList.contains("open")?"▴ 收起详情":"▾ 点击查看详情";
}
function chg(id,d){
  var dish=dishes[id];
  dish.qty=Math.max(0,dish.qty+d);
  if(d>0&&dish.qty===1)toast("已添加「"+dish.name+"」");
  if(dish.qty===0&&d<0)toast("已移除「"+dish.name+"」");
  render();
}
function updCart(){
  var total=0,count=0;
  dishes.forEach(function(d){total+=d.qty;if(d.qty>0)count++});
  var b=document.getElementById("badge"),ct=document.getElementById("cartTotal"),ch=document.getElementById("cartHint"),cb=document.getElementById("cartBtn");
  if(total>0){b.textContent=total;b.classList.remove("hide");ct.textContent="已选 "+count+" 道菜，共 "+total+" 份";ch.textContent="点击购物车查看";cb.disabled=false}
  else{b.classList.add("hide");ct.textContent="未选菜品";ch.textContent="点击 ＋ 选菜";cb.disabled=true}
  var list=document.getElementById("drawerList");
  var sel=dishes.filter(function(d){return d.qty>0});
  if(!sel.length){list.innerHTML='<div class="empty-msg">还没有选菜哦～</div>';return}
  var h="";
  sel.forEach(function(d){h+='<div class="drawer-item"><span class="drawer-item-name">'+d.name+'</span><div class="drawer-item-ctrl"><button class="btn-m" onclick="chg('+d.id+',-1)">－</button><span class="card-qty">'+d.qty+'</span><button class="btn-p" onclick="chg('+d.id+',1)">＋</button></div></div>'});
  list.innerHTML=h;
}
function toggleDrawer(){
  var o=document.getElementById("overlay"),d=document.getElementById("drawer");
  var s=o.classList.contains("show");
  if(s){o.classList.remove("show");d.classList.remove("show")}
  else{o.classList.add("show");d.classList.add("show")}
}
function clearAll(){dishes.forEach(function(d){d.qty=0});toast("已清空");render();toggleDrawer()}
function submitOrder(){
  var lines=dishes.filter(function(d){return d.qty>0}).map(function(d){return d.name+" ×"+d.qty});
  toast("✅ "+lines.join("、"));
}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}
document.getElementById("tabs").addEventListener("click",function(e){
  if(!e.target.classList.contains("tab"))return;
  currentCat=e.target.dataset.cat;
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on")});
  e.target.classList.add("on");render();
});
render();
</script>
</body>
</html>
